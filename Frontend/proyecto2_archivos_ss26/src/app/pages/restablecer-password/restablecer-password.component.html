<app-dialogo titulo="Restablecer contraseña" ancho="sm" [bloqueado]="guardando()" (cerrado)="cerrado.emit()">
    @if (errorGeneral()) {
    <div class="alert alert-danger d-flex align-items-start gap-2" role="alert">
        <i class="bi bi-exclamation-circle-fill mt-1" aria-hidden="true"></i>
        <span>{{ errorGeneral() }}</span>
    </div>
    }

    <p class="mb-3">
        Define una contraseña nueva para <strong>{{ usuario().nombreCompleto }}</strong>
        (&#64;{{ usuario().username }}). Compártesela por un medio seguro.
    </p>

    <form [formGroup]="formulario" (ngSubmit)="guardar()" novalidate>
        <label for="rc-contrasena" class="form-label">Contraseña nueva</label>
        <div class="input-group has-validation">
            <input id="rc-contrasena" [type]="verPassword() ? 'text' : 'password'" class="form-control"
                formControlName="newPassword" autocomplete="new-password" [class.is-invalid]="error()"
                [attr.aria-describedby]="error() ? 'rc-error' : 'rc-ayuda'" />
            <button type="button" class="btn btn-outline-secondary" (click)="verPassword.set(!verPassword())"
                [attr.aria-pressed]="verPassword()"
                [attr.aria-label]="verPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'">
                <i [class]="verPassword() ? 'bi bi-eye-slash' : 'bi bi-eye'" aria-hidden="true"></i>
            </button>
            @if (error(); as mensaje) {
            <div id="rc-error" class="invalid-feedback">{{ mensaje }}</div>
            }
        </div>
        @if (!error()) {
        <div id="rc-ayuda" class="form-text">Mínimo 8 caracteres, con al menos una letra y un número.</div>
        }

        <div class="d-flex justify-content-end gap-2 mt-4">
            <button type="button" class="btn btn-outline-secondary" [disabled]="guardando()" (click)="cerrado.emit()">
                Cancelar
            </button>
            <button type="submit" class="btn btn-primary" [disabled]="guardando()">
                @if (guardando()) {
                <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
                Guardando…
                } @else {
                Restablecer
                }
            </button>
        </div>
    </form>
</app-dialogo>
