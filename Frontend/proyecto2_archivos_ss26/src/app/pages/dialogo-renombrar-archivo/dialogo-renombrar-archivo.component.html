<app-dialogo titulo="Renombrar archivo" ancho="sm" [bloqueado]="guardando()" (cerrado)="cerrado.emit()">
    @if (errorGeneral()) {
    <div class="alert alert-danger d-flex align-items-start gap-2" role="alert">
        <i class="bi bi-exclamation-circle-fill mt-1" aria-hidden="true"></i>
        <span>{{ errorGeneral() }}</span>
    </div>
    }

    <form [formGroup]="formulario" (ngSubmit)="guardar()" novalidate>
        <label for="ra-nombre" class="form-label">Nombre del archivo</label>
        <input id="ra-nombre" type="text" class="form-control" formControlName="nombre" autocomplete="off" autofocus
            [class.is-invalid]="error()" [attr.aria-describedby]="error() ? 'ra-error' : 'ra-ayuda'"
            (focus)="seleccionarNombreSinExtension($event)" />
        @if (error(); as mensaje) {
        <div id="ra-error" class="invalid-feedback">{{ mensaje }}</div>
        } @else {
        <div id="ra-ayuda" class="form-text">Debe terminar en .txt o .md</div>
        }

        <div class="d-flex justify-content-end gap-2 mt-4">
            <button type="button" class="btn btn-outline-secondary" [disabled]="guardando()" (click)="cerrado.emit()">
                Cancelar
            </button>
            <button type="submit" class="btn btn-primary" [disabled]="guardando()">
                @if (guardando()) {
                <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
                Guardando...
                } @else {
                Renombrar
                }
            </button>
        </div>
    </form>
</app-dialogo>
