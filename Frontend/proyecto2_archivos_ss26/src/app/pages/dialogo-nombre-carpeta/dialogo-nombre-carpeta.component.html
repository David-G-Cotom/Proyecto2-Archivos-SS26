<app-dialogo [titulo]="esRenombrar() ? 'Renombrar carpeta' : 'Nueva carpeta'" ancho="sm" [bloqueado]="guardando()"
    (cerrado)="cerrado.emit()">
    @if (errorGeneral()) {
    <div class="alert alert-danger d-flex align-items-start gap-2" role="alert">
        <i class="bi bi-exclamation-circle-fill mt-1" aria-hidden="true"></i>
        <span>{{ errorGeneral() }}</span>
    </div>
    }

    <form [formGroup]="formulario" (ngSubmit)="guardar()" novalidate>
        <label for="dn-nombre" class="form-label">Nombre de la carpeta</label>
        <!-- autofocus: el diálogo nativo enfoca este campo al abrirse; al renombrar se selecciona el texto -->
        <input id="dn-nombre" type="text" class="form-control" formControlName="nombre" autocomplete="off" autofocus
            placeholder="Ej.: Contratos 2026" [class.is-invalid]="error()"
            [attr.aria-describedby]="error() ? 'dn-error' : null" (focus)="seleccionarTexto($event)" />
        @if (error(); as mensaje) {
        <div id="dn-error" class="invalid-feedback">{{ mensaje }}</div>
        }

        <div class="d-flex justify-content-end gap-2 mt-4">
            <button type="button" class="btn btn-outline-secondary" [disabled]="guardando()" (click)="cerrado.emit()">
                Cancelar
            </button>
            <button type="submit" class="btn btn-primary" [disabled]="guardando()">
                @if (guardando()) {
                <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
                Guardando...
                } @else {
                {{ esRenombrar() ? 'Renombrar' : 'Crear carpeta' }}
                }
            </button>
        </div>
    </form>
</app-dialogo>
